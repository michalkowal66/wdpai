<!DOCTYPE html>
<html lang="en">
<head>
    <?php include __DIR__ . '/partials/head.html'; ?>
    <title><?= $title ?? 'My Bookings - HotDesk'; ?></title>
</head>
<body class="page page--dashboard">
    <?php include __DIR__ . '/partials/nav.html'; ?>

    <main class="main main--dashboard">
        <div class="container dashboard-container">
            
            <header class="dashboard-header">
                <div class="dashboard-header__text">
                    <h2 class="dashboard-header__title">My Bookings</h2>
                    <p class="dashboard-header__subtitle desktop-only">Manage your upcoming and past desk reservations.</p>
                </div>
                <div class="dashboard-header__actions">
                    <a href="map" class="btn btn--primary btn--full">
                        <span class="material-symbols-outlined">add</span> Book New Desk
                    </a>
                </div>
            </header>

            <nav class="tabs">
                <a href="?tab=upcoming" class="tabs__link <?= $tab === 'upcoming' ? 'tabs__link--active' : '' ?>" data-tab="upcoming">Upcoming</a>
                <a href="?tab=history" class="tabs__link <?= $tab === 'history' ? 'tabs__link--active' : '' ?>" data-tab="history">History</a>
                <a href="?tab=cancelled" class="tabs__link <?= $tab === 'cancelled' ? 'tabs__link--active' : '' ?>" data-tab="cancelled">Cancelled</a>
            </nav>

            <section class="bookings-list" id="bookings-list-container">
                
                <?php if(empty($displayBookings)): ?>
                    <div class="empty-state" id="empty-state">
                        <span class="material-symbols-outlined empty-state__icon">calendar_today</span>
                        <p class="empty-state__text">No bookings found in this category.</p>
                    </div>
                <?php endif; ?>

                <?php foreach($displayBookings as $b): 
                    $isPast = $b['booking_date'] < date('Y-m-d');
                    
                    // Determine Badge
                    $badgeClass = '';
                    $badgeText = '';
                    $statusDotClass = '';
                    $statusText = '';
                    
                    if ($b['status'] === 'CANCELLED' || $b['status'] === 'NO_SHOW') {
                        $badgeClass = 'booking-card__badge--neutral';
                        $friendlyText = $b['status'] === 'CANCELLED' ? 'Cancelled' : 'No Show';
                        $badgeText = $friendlyText;
                        $statusDotClass = 'status-dot--neutral';
                        $statusText = $friendlyText;
                    } elseif ($b['status'] === 'CHECKED_IN') {
                        $badgeClass = $isPast ? 'booking-card__badge--neutral' : 'booking-card__badge--success';
                        $badgeText = $isPast ? 'Completed' : 'Checked In';
                        $statusDotClass = $isPast ? 'status-dot--neutral' : 'status-dot--success';
                        $statusText = $isPast ? 'Completed' : 'Checked In';
                    } else { // ACTIVE
                        $badgeClass = 'booking-card__badge--info';
                        $badgeText = 'Upcoming';
                        $statusDotClass = 'status-dot--warning';
                        $statusText = 'Pending Check-in';
                    }
                ?>
                <article class="booking-card <?= $isPast ? 'booking-card--past' : '' ?>">
                    <figure class="booking-card__image-wrapper">
                        <img src="<?= htmlspecialchars($b['floor_map_url']) ?>" alt="<?= htmlspecialchars($b['floor_name']) ?>" class="booking-card__image object-top">
                        <span class="booking-card__badge <?= $badgeClass ?> desktop-only"><?= $badgeText ?></span>
                    </figure>
                    <div class="booking-card__content">
                        <header class="booking-card__header">
                            <div class="booking-card__date <?= $isPast ? 'text-muted' : '' ?>">
                                <span class="material-symbols-outlined">calendar_month</span>
                                <span><?= date('l, M j, Y', strtotime($b['booking_date'])) ?></span>
                            </div>
                            <h3 class="booking-card__title">Desk <?= htmlspecialchars($b['desk_identifier']) ?></h3>
                            <div class="booking-card__details">
                                <span class="feature-tag"><span class="material-symbols-outlined">schedule</span> All Day</span>
                                <span class="feature-tag"><span class="material-symbols-outlined">location_on</span> <?= htmlspecialchars($b['floor_name']) ?></span>
                            </div>
                        </header>
                        <footer class="booking-card__footer">
                            <div class="booking-card__status">
                                <span class="status-dot <?= $statusDotClass ?>"></span>
                                <span class="status-text"><?= $statusText ?></span>
                            </div>
                            <div class="booking-card__actions <?= $isPast ? 'ml-auto' : '' ?>">
                                <?php if (!$isPast && $b['status'] === 'ACTIVE'): ?>
                                    <?php if ($b['booking_date'] === date('Y-m-d')): ?>
                                        <button class="btn btn--primary btn--small" onclick="checkInBooking(<?= $b['id'] ?>)">
                                            <span class="material-symbols-outlined desktop-only">check_circle</span> Check In
                                        </button>
                                    <?php endif; ?>
                                    <button class="btn btn--secondary btn--danger <?= $b['booking_date'] === date('Y-m-d') ? 'btn--small' : 'btn--full' ?>" onclick="cancelBooking(<?= $b['id'] ?>)">
                                        <span class="material-symbols-outlined desktop-only">cancel</span> Cancel
                                    </button>
                                <?php elseif ($isPast || $b['status'] === 'CHECKED_IN' || $b['status'] === 'CANCELLED' || $b['status'] === 'NO_SHOW'): ?>
                                    <a href="/map?floor=<?= $b['floor_level'] ?>&date=<?= date('Y-m-d', strtotime('+1 day')) ?>" class="btn btn--link">
                                        Book Again <span class="material-symbols-outlined">arrow_forward</span>
                                    </a>
                                <?php endif; ?>
                            </div>
                        </footer>
                    </div>
                </article>
                <?php endforeach; ?>

            </section>
            
            <div class="load-more <?= $remainingCount > 0 ? '' : 'is-hidden' ?>" id="load-more-container">
                <button id="load-more-btn" class="btn btn--text" data-offset="<?= $limit ?>" data-tab="<?= $tab ?>">Load more history<span id="remaining-count">(<?= $remainingCount ?></span> remaining) <span class="material-symbols-outlined">expand_more</span></button>
            </div>

        </div>
    </main>

    <script src="/public/scripts/bookings.js" defer></script>
</body>
</html>
